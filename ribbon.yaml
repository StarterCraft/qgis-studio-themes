              - "mActionModifyAnnotation"
        large: ["annotationLayerToolButtonAction"]
        layout: labels
      - title: "Draw"
        sources:
          - toolbar: "mAnnotationsToolBar"
            actions:
              - "mActionPolygonAnnotation"
              - "mActionLineAnnotation"
              - "mActionMarkerAnnotation"
              - "mActionTextAnnotationatPoint"
              - "mActionTextAnnotationalongLine"
              - "mActionTextAnnotationinRectangle"
              - "mActionPictureAnnotation"
        layout: icons
      - title: "Map Annotations"
        sources:

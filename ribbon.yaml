# The ribbon's tabs, in order (read by studio_ribbon.py at startup).
# A profile's own copy (studio_themes/ribbon.yaml in the QGIS profile folder, saved by
# Plugins > QGIS Studio Themes > Ribbon Editor) is read instead when there is one.
# A tab titled "Plugins" is needed: plugins' own toolbars and menus go there.
# Tab and group titles stay English; translations are in i18n/ by context "title".
#
# A group:
#   title:   its name
#   sources: where its buttons come from, in order; each one of
#     - toolbar: <toolbar objectName>
#       actions: [<action objectNames>]   # omit: the toolbar's actions no other group names
#     - main: [<objectNames>]   # actions of the main window not on a toolbar, or menus
#                               # (shown as a button opening the menu)
#     - menu: [<menu objectNames>]   # what those menus hold that the ribbon has nowhere else
#     - dropdown:                    # a button with a list of its own
#         action: <objectName>       # the command on its face (the list opens from its arrow);
#                                    # omit for a button that only opens the list
#         title: <label>             # its label (optional with action:)
#         items: [<objectNames>]     # commands, or menus (shown as submenus); "-" draws a line;
#                                    # "<menu objectName>/*": that menu's commands right in the
#                                    # list, between lines (e.g. "mRecentProjectsMenu/*");
#                                    # "<menu objectName>/*:title": the same under the menu's
#                                    # name, a caption that is not clicked; caption: or note:
#                                    # (below) as items too
#     - caption: {text: <text>, for: <objectName>}   # a text in the rows, never clicked
#     - note: {text: <text>, for: <objectName>}      # the same, plain (caption: semibold)
#         text: optional (default "{title}"); {title} is the label of the command or menu
#         named in for:, {id} its objectName; for: optional. Plain text: caption: "<text>"
#   large:   objectNames shown as large buttons (optional; a dropdown by its action, else title)
#   labelled: objectNames shown small with their label in an icons or auto group, in a
#            column of their own before its icon-only buttons (optional)
#   layout:  labels | icons | auto   (auto: plugins' groups; large labelled buttons
#            for up to 3 actions, else icons)
#   rows:    explicit rows of small buttons, lists of objectNames (optional)
#
# labels: (optional, after tabs:) texts of one's own for buttons, wherever they are:
#   labels:
#     mActionOpenProject: "Open…"       # {title}: the text it would have, {id}: its objectName
# icons: (optional) icons of one's own for buttons, wherever they are:
#   icons:
#     mActionExit: "action:mActionCloseProject"              # another command's icon
#     mActionOpenProject: ":/images/themes/default/mActionFileOpen.svg"   # QGIS's theme
#     myPluginRun: "C:/icons/run.svg"                        # a file, or a Qt resource ":/..."

tabs:
  - title: "Project"
    groups:
      - title: "Project"
        sources:
          - main:
              - "mActionNewProject"
              - "mActionOpenProject"
              - "mActionSaveProject"
              - "mProjectFromTemplateMenu"
              - "mRecentProjectsMenu"
              - "mProjectFromStorageMenu"
              - "mActionSaveProjectAs"
              - "mProjectToStorageMenu"
              - "mActionRevertProject"
              - "mActionCloseProject"
              - "mActionExit"
        large: ["mActionNewProject", "mActionOpenProject", "mActionSaveProject"]
        layout: labels
      - title: "Settings"
        sources:
          - main: ["mActionProjectProperties", "mActionSnappingOptions", "mActionStyleManager"]
        large: ["mActionProjectProperties"]
        layout: labels
      - title: "Import and Export"
        sources:
          - main:
              - "mActionSaveMapAsImage"
              - "mActionSaveMapAsPdf"
              - "mActionDxfExport"
              - "mActionDwgImport"
        layout: labels
      - title: "Layouts"
        sources:
          - main:
              - "mActionNewPrintLayout"
              - "mActionNewReport"
              - "mActionShowLayoutManager"
              - "mLayoutsMenu"
        large: ["mActionNewPrintLayout"]
        layout: labels
      - title: "More"
        sources:
          - menu: ["mProjectMenu"]
        layout: labels
  - title: "Home"
    groups:
      - title: "Project"
        sources:
          - toolbar: "mFileToolBar"
        large: ["mActionNewProject", "mActionOpenProject", "mActionSaveProject"]
        layout: labels
      - title: "Navigate"
        sources:
          - toolbar: "mMapNavToolBar"
            actions:
              - "mActionPan"
              - "mActionPanToSelected"
              - "mActionZoomIn"
              - "mActionZoomOut"
              - "mActionZoomFullExtent"
              - "mActionZoomToSelected"
              - "mActionZoomToLayers"
              - "mActionZoomActualSize"
              - "mActionZoomLast"
              - "mActionZoomNext"
              - "mActionDraw"
        large: ["mActionPan"]
        labelled: ["mActionZoomIn", "mActionZoomOut", "mActionZoomFullExtent"]
        layout: icons
      - title: "Select"
        sources:
          - toolbar: "mSelectionToolBar"
            actions: ["ActionSelect", "ActionDeselection"]
          - toolbar: "mSelectionToolBar"
          - main: ["mActionReselect"]
        large: ["ActionSelect", "ActionDeselection"]
        layout: icons
      - title: "Inspect"
        sources:
          - toolbar: "mAttributesToolBar"
        large: ["mActionIdentify", "ActionOpenTable"]
        layout: labels
  - title: "Data"
    groups:
      - title: "Add Data"
        sources:
          - toolbar: "mDataSourceManagerToolBar"
            actions: ["mActionDataSourceManager"]
        large: ["mActionDataSourceManager"]
        layout: labels
      - title: "Add Layer"
        sources:
          - toolbar: "mLayerToolBar"
            actions:
              - "mActionAddOgrLayer"
              - "mActionAddRasterLayer"
              - "mActionAddMeshLayer"
              - "mActionAddDelimitedText"
              - "mActionAddSpatiaLiteLayer"
              - "mActionAddVirtualLayer"
              - "ActionAddDbLayer"
              - "mActionAddWmsLayer"
              - "mActionAddWcsLayer"
              - "mActionAddWfsLayer"
              - "mActionAddStacLayer"
        layout: labels
      - title: "Create Layer"
        sources:
          - toolbar: "mDataSourceManagerToolBar"
          - toolbar: "mLayerToolBar"
        large: ["mActionNewGeoPackageLayer"]
        layout: labels
      - title: "More Data"
        sources:
          - main: ["mAddLayerMenu", "mNewLayerMenu", "mActionEmbedLayers", "mActionAddLayerDefinition"]
        layout: labels
  - title: "Layer"
    groups:
      - title: "Layer"
        sources:
          - main:
              - "mActionLayerProperties"
              - "mActionLayerSubsetString"
              - "mActionDuplicateLayer"
              - "mActionSetLayerCRS"
              - "mActionSetProjectCRSFromLayer"
              - "mActionSetLayerScaleVisibility"
              - "mActionLayerSaveAs"
              - "mActionSaveLayerDefinition"
              - "mActionRemoveLayer"
        large: ["mActionLayerProperties"]
        layout: labels
      - title: "Copy and Paste"
        sources:
          - main: ["mActionCopyStyle", "mActionPasteStyle", "mActionCopyLayer", "mActionPasteLayer"]
        layout: labels
      - title: "Overview"
        sources:
          - main: ["mActionAddToOverview", "mActionAddAllToOverview", "mActionRemoveAllFromOverview"]
        layout: labels
      - title: "More"
        sources:
          - menu: ["mLayerMenu"]
        layout: labels
  - title: "Edit"
    groups:
      - title: "Editing"
        sources:
          - toolbar: "mDigitizeToolBar"
            actions: ["mActionToggleEditing", "mActionSaveLayerEdits", "mActionAllEdits"]
        large: ["mActionToggleEditing"]
        layout: labels
      - title: "Digitize"
        sources:
          - toolbar: "mDigitizeToolBar"
            actions: ["mActionAddFeature", "ActionVertexTool", "mDigitizeModeToolButton"]
        large: ["mActionAddFeature", "ActionVertexTool"]
        layout: labels
      - &select
        title: "Select"
        sources:
          - toolbar: "mSelectionToolBar"
            actions: ["ActionSelect", "ActionDeselection"]
          - main: ["mActionReselect"]
        large: ["ActionSelect", "ActionDeselection"]
        layout: labels
      - title: "Features"
        sources:
          - toolbar: "mDigitizeToolBar"
            actions:
              - "mActionMultiEditAttributes"
              - "mActionDeleteSelected"
              - "mActionCutFeatures"
              - "mActionCopyFeatures"
              - "mActionPasteFeatures"
          - main: ["mMenuPasteAs"]
        layout: labels
      - title: "History"
        sources:
          - toolbar: "mDigitizeToolBar"
        layout: labels
      - title: "Snapping"
        sources:
          - toolbar: "mSnappingToolBar"
        layout: icons
        rows:
          -
              - "EnableSnappingAction"
              - "mModeAction"
              - "mEditAdvancedConfigAction"
              - "mTypeAction"
              - "mToleranceAction"
              - "mUnitAction"
          -
              - "TopologicalEditingAction"
              - "mAvoidIntersectionsModeAction"
              - "IntersectionSnappingAction"
              - "EnableTracingAction"
              - "SelfSnappingAction"
      - title: "Shapes"
        sources:
          - toolbar: "mShapeDigitizeToolBar"
        layout: icons
      - title: "More"
        sources:
          - menu: ["mEditMenu"]
        layout: labels
  - title: "Modify"
    groups:
      - *select
      - title: "Advanced"
        sources:
          - toolbar: "mAdvancedDigitizeToolBar"
            actions: ["mEnableAction"]
        large: ["mEnableAction"]
        layout: labels
      - title: "Transform"
        sources:
          - toolbar: "mAdvancedDigitizeToolBar"
            actions:
              - "ActionMoveFeatureTool"
              - "mActionRotateFeature"
              - "mActionScaleFeature"
              - "mActionSimplifyFeature"
              - "mActionOffsetCurve"
              - "mActionReverseLine"
        layout: labels
      - title: "Rings and Parts"
        sources:
          - toolbar: "mAdvancedDigitizeToolBar"
            actions:
              - "mActionAddRing"
              - "mActionAddPart"
              - "mActionFillRing"
              - "mActionDeleteRing"
              - "mActionDeletePart"
        layout: labels
      - title: "Reshape"
        sources:
          - toolbar: "mAdvancedDigitizeToolBar"
            actions:
              - "mActionReshapeFeatures"
              - "mActionChamferFillet"
              - "mActionTrimExtendFeature"
              - "mActionSplitFeatures"
              - "mActionSplitParts"
              - "mActionMergeFeatures"
              - "mActionMergeFeatureAttributes"
        layout: labels
      - title: "Point Symbols"
        sources:
          - toolbar: "mAdvancedDigitizeToolBar"
        layout: labels
  - title: "Annotate"
    groups:
      - title: "Labels"
        sources:
          - toolbar: "mLabelToolBar"
            actions: ["mActionLabeling", "mActionDiagramProperties"]
        large: ["mActionLabeling", "mActionDiagramProperties"]
